name: cache

services:
  cache:
    build: .
    container_name: cache
    restart: unless-stopped
    ports:
      - "9178:8000"
    environment:
      MAX_UPLOAD_MB: 2048
    volumes:
      - ./data:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/items')"]
      interval: 30s
      timeout: 5s
      retries: 3
