<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>cache</title>
  <link rel="stylesheet" href="/app.css?v=20260802-1">
</head>
<body>
  <main>
    <header>
      <div class="actions">
        <a class="star-link" href="https://github.com/reallapt/cache" target="_blank" rel="noreferrer">Give us a star!</a>
        <button class="language-button" id="languageToggle" type="button" aria-label="Switch language">EN</button>
        <button class="auto-delete-button" id="autoDeleteToggle" type="button" aria-pressed="true">
          <span class="auto-delete-icon" aria-hidden="true">◷</span><span id="autoDeleteLabel">自动删除：开</span>
        </button>
        <button class="icon-button" id="addText" type="button" title="新建文字" aria-label="新建文字">
          <span class="text-icon" aria-hidden="true">T</span>
        </button>
        <button class="icon-button" id="addFolder" type="button" title="上传文件夹" aria-label="上传文件夹">
          <span class="folder-icon" aria-hidden="true"></span>
        </button>
        <button class="add-button" id="addFiles" type="button">
          <span aria-hidden="true">+</span><span id="uploadLabel">上传</span>
        </button>
      </div>
    </header>

    <section class="content" aria-live="polite">
      <div class="empty" id="emptyState">
        <button class="empty-drop" id="emptyDrop" type="button">
          <span class="empty-plus" aria-hidden="true">+</span>
          <span>拖入文件，或按 Ctrl+V 粘贴</span>
        </button>
      </div>
      <div class="items" id="items"></div>
    </section>
  </main>

  <div class="drop-overlay" id="dropOverlay"><span>松开以上传</span></div>

  <dialog id="textDialog">
    <form id="textForm">
      <div class="dialog-head">
        <input id="textTitle" maxlength="120" placeholder="标题" autocomplete="off">
        <button class="close-button" type="button" id="closeDialog" aria-label="关闭">×</button>
      </div>
      <textarea id="textContent" placeholder="写点什么…" required></textarea>
      <div class="dialog-actions">
        <span id="textCount">0 字</span>
        <button class="save-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog class="confirm-dialog" id="deleteDialog">
    <form method="dialog">
      <p id="deleteMessage"></p>
      <div class="confirm-actions">
        <button class="cancel-button" value="cancel" type="submit">取消</button>
        <button class="danger-button" id="confirmDelete" value="confirm" type="submit">删除</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <input id="fileInput" type="file" multiple hidden>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <script src="/app.js?v=20260728-2"></script>
</body>
</html>
